# Optional: `pip install -e .` from this folder puts cmsi on the path for good.
# The scripts work without it (they add src/ themselves), so this is convenience,
# not a requirement.
[project]
name = "cmsi"
version = "0.1.0"
description = "Causal inference across reference frames in a feedforward network"
requires-python = ">=3.10"
dependencies = [
  "numpy", "scipy", "scikit-learn", "matplotlib", "torch", "pyyaml",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
