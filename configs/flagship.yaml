# FLAGSHIP config -- the p_common = 0.5 network of the design document.
#
# Derived from configs/matlab_match.yaml by the calibration pass the design
# demands before any training (SS8 + SS4 + SS3). What changed and why:
#
#   sensory noise x0.30   matlab_match put 56% of trials at intermediate
#                         posteriors; the design asks for ~25% (SS8.1,
#                         "all-intermediate -> widen sigma_P or tighten sensory
#                         noise"). Tightening the noise was chosen over widening
#                         sigma0_sq because it leaves the retinal spread -- and
#                         therefore the containment rejection rate -- untouched.
#                         Realised: 25% intermediate, 37% confident.
#
#   gain_K 50 -> 180      SS4 Poisson validity. At K=50/rf_width=10 the visual
#   rf_width 10 -> 6      population's decoded variance ran 26-28% ABOVE the
#   n_vis 50 -> 76        nominal sigma^2, so every target was miscalibrated in
#                         exactly the regime causal ambiguity lives in. The
#                         three changes together bring it to ~2-3%. The
#                         push-pull (hand / eye) codes were already within 2%
#                         at every K and are unchanged in kind.
#
#   visual_field +-85     SS3 range containment. Retinal sd is 27.6 deg here;
#                         +-85 with a 2*rf_width margin rejects 0.8% of trials,
#                         inside the design's "keep rejection < a few %".
#                         (matlab_match's +-75/rf_width 10 would have rejected
#                         4.6%, and had no rejection mechanism at all.)
#
#   equal group sizes     76 units per population, matching the earlier project.
#
# Every satellite and control (configs/pcommon*.yaml) is this file with ONLY
# the Bernoulli constant changed, per SS9.3.
#
# Units: positions in degrees, variances in deg^2.

seed: 0

# --------------------------------------------------------------------------- #
# GENERATIVE MODEL
#   C ~ Bernoulli(p_common):  C=1 one shared source, C=2 two independent ones
#   vision is retinal (needs the eye signal), proprioception is body-framed
# --------------------------------------------------------------------------- #
generative:
  p_common: 0.5

  mu0: 0.0                     # spatial prior mean on hand position
  sigma0_sq: 425.0             # hand sd 20.6 deg

  eye_mu: 0.0
  eye_sigma_sq: 325.0          # eye sd 18.0 deg

  # Per-trial measurement noise, drawn uniform and independently of C.
  # matlab_match's ranges scaled by 0.30 (see header). sd in brackets.
  sigma2_vis_range:  [1.2, 6.6]     # sd 1.1-2.6 deg
  sigma2_prop_range: [1.8, 9.6]     # sd 1.3-3.1 deg
  sigma2_eye_range:  [3.3, 13.2]    # sd 1.8-3.6 deg

# --------------------------------------------------------------------------- #
# ENCODING (scalar measurements -> population codes = the network input)
# --------------------------------------------------------------------------- #
encoding:
  n_vis: 76                    # gaussian receptive fields, retinal visual cue
  n_prop: 76                   # push-pull code, proprioceptive hand
  n_eye: 76                    # push-pull code, eye position
  visual_field: [-85.0, 85.0]  # 2*rf_width margin -> 0.8% containment rejection
  rf_width: 6.0
  gain_K: 180.0                # activity gain = gain_K / variance (SS4-calibrated)
  slope_range: [-1.0, 1.0]
  intercept_range: [0.0, 10.0]
  poisson_noise: true

# --------------------------------------------------------------------------- #
# MODEL
# --------------------------------------------------------------------------- #
model:
  hidden: [64, 64]             # layer 0 = SIL, layer 1 = MSL
  activation: sigmoid          # sigmoid | relu | tanh
  head: causal                 # causal (4 outputs) | fused (2 outputs, control twin)

# --------------------------------------------------------------------------- #
# TRAINING
#   The test split is stratified by analytical-posterior decile (SS8.4) so the
#   binned model comparison has equal power in every bin.
# --------------------------------------------------------------------------- #
training:
  n_trials: 50000
  split: [0.7, 0.15, 0.15]
  optimizer: adam              # adam | rprop (rprop is full-batch only)
  lr: 0.001
  epochs: 300
  batch_size: 256
  patience: 20
  standardize_inputs: true
  balance_loss: true

# --------------------------------------------------------------------------- #
# ANALYSIS
# --------------------------------------------------------------------------- #
analysis:
  disparity_grid: [-40, -30, -20, -15, -10, -5, -2, 0, 2, 5, 10, 15, 20, 30, 40]
  reliability_levels: [1.5, 3.5, 6.0]   # must lie inside sigma2_vis_range
  min_separation: 1.0          # deg; below this the implied fusion weight is unstable
  sigma_w_criterion: 0.1       # SS7.1: keep trials whose implied w is readable
  ridge_alpha: 1.0
  decoder_test_size: 0.25
