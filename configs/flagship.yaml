# FLAGSHIP config -- the p_common = 0.5 network (since 2026-10-02).
#
# The configuration the implied-weight investigation of September 2026
# converged on (IMPLIED_WEIGHT_RESULT.md, Parts I-IV; trained there as
# exp2_64_mean). The previous flagship -- configs/flagship_wide.yaml:
# sigma0_sq 425, eye_sigma_sq 325, wide noise ranges -- was Bayes-optimal only
# to a position-regression slope of 0.86 with this 64 x 64 network; the
# investigation traced that to the input domain relative to the sensory noise,
# not to the network. What changed and why:
#
#   sigma0_sq 425 -> 100     the spread of hand positions (sd 20.6 -> 10 deg) and
#   eye_sigma_sq 325 -> 81   of eye positions (sd 18 -> 9 deg): the domain the
#                            populations have to cover, relative to the noise,
#                            is what decides whether the network learns the
#                            optimal weighting (Part I, section 4).
#
#   narrow noise ranges      sigma2 [1, 1.2] / [4, 4.5] / [3.7, 4.2] deg^2 for
#                            vision / hand / eye (sd 1.0-1.1, 2.0-2.1, 1.9-2.0
#                            deg): the reliability-dependent weighting is easy to
#                            learn (slope +0.03 against the wide ranges). The
#                            cost is that reliability barely varies, so figure
#                            05's levels differ by little; `06 reliability
#                            --levels 5` splits what variation there is into
#                            quantiles.
#
# Everything else -- the encoding (76 units per population, rf_width 6, gain_K
# 180, visual field +-85), the network and the training -- is unchanged from
# flagship_wide.yaml, and so are the reasons given in its header.
#
# What it gives (the exp2_64_mean run, hybrid read of the weight, visual
# channel): weight on the posterior slope 0.977 [0.967, 0.988], position
# regression 0.952 (hand 0.939), variance regression 0.977, 0.1 % of per-trial
# weights outside [-1, 2], transition midpoint 4.89 deg against 5.08
# analytical, reliability-within-disparity slope 0.89 +- 0.02; sigma_out 0.39
# deg on the control.
#
# The calibration gate WARNs on this configuration and does not stop: 49 % of
# trials sit at intermediate posterior (SS8.1 asks for ~25 %) because two
# independent sources drawn from a 10-deg prior are often as close as one
# shared source, and the posterior at zero disparity is capped near 0.8. That
# is the trade-off of the small domain (Part I, section 4.3); the hand
# positions reach only +-30 deg, so the +-85 visual field rejects 0.0 % of
# trials.
#
# Every satellite and control (configs/pcommon*.yaml) is this file with ONLY
# the Bernoulli constant changed, per SS9.3.
#
# Units: positions in degrees, variances in deg^2.

seed: 0

# --------------------------------------------------------------------------- #
# GENERATIVE MODEL
#   C ~ Bernoulli(p_common):  C=1 one shared source, C=2 two independent ones
#   vision is retinal (needs the eye signal), proprioception is body-framed
# --------------------------------------------------------------------------- #
generative:
  p_common: 0.5

  mu0: 0.0                     # spatial prior mean on hand position
  sigma0_sq: 100.0             # hand sd 10 deg

  eye_mu: 0.0
  eye_sigma_sq: 81.0           # eye sd 9 deg

  # Per-trial measurement noise, drawn uniform and independently of C.
  # Narrow ranges (see header). sd in brackets.
  sigma2_vis_range:  [1.0, 1.2]     # sd 1.0-1.1 deg
  sigma2_prop_range: [4.0, 4.5]     # sd 2.0-2.1 deg
  sigma2_eye_range:  [3.7, 4.2]     # sd 1.9-2.0 deg

# --------------------------------------------------------------------------- #
# ENCODING (scalar measurements -> population codes = the network input)
# --------------------------------------------------------------------------- #
encoding:
  n_vis: 76                    # gaussian receptive fields, retinal visual cue
  n_prop: 76                   # push-pull code, proprioceptive hand
  n_eye: 76                    # push-pull code, eye position
  visual_field: [-85.0, 85.0]  # 2*rf_width margin -> 0.0% containment rejection here
  rf_width: 6.0
  gain_K: 180.0                # activity gain = gain_K / variance (SS4-calibrated)
  slope_range: [-1.0, 1.0]
  intercept_range: [0.0, 10.0]
  poisson_noise: true

# --------------------------------------------------------------------------- #
# MODEL
# --------------------------------------------------------------------------- #
model:
  hidden: [64, 64]             # layer 0 = SIL, layer 1 = MSL
  activation: sigmoid          # sigmoid | relu | tanh
  head: causal                 # causal (4 outputs) | fused (2 outputs, control twin)

# --------------------------------------------------------------------------- #
# TRAINING
#   The test split is stratified by analytical-posterior decile (SS8.4) so the
#   binned model comparison has equal power in every bin.
# --------------------------------------------------------------------------- #
training:
  n_trials: 50000
  split: [0.7, 0.15, 0.15]
  optimizer: adam              # adam | rprop (rprop is full-batch only)
  lr: 0.001
  epochs: 300
  batch_size: 256
  patience: 20
  standardize_inputs: true
  balance_loss: true

# --------------------------------------------------------------------------- #
# ANALYSIS
# --------------------------------------------------------------------------- #
analysis:
  # Bin centres of the disparity curves (figures 03/04/05/12, manuscript Fig. 4A/C,
  # the conditioned-bias flag); trials go to the nearest centre. Since 2026-10-03:
  # 2-deg steps across the transition (|d| < 12 holds 80 % of the trials on this
  # domain, 99 % lie below 34 deg), ending at +-30 so no bin rests on a few dozen
  # trials. The analysis block is not a training parameter -- 03_analyze.py
  # --config applies a change to an existing run without retraining.
  disparity_grid: [-30, -20, -15, -12, -10, -8, -6, -4, -2, 0, 2, 4, 6, 8, 10, 12, 15, 20, 30]
  reliability_levels: [1.0, 1.1, 1.2]   # must lie inside sigma2_vis_range; with this
                                        # range figure 05's levels differ by little
  ridge_alpha: 1.0
  decoder_test_size: 0.25
