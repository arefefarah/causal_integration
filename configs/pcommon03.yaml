# SATELLITE p_common = 0.3 (design SS9.3). Only the Bernoulli constant differs
# from configs/flagship.yaml -- same seed, same ranges -- so cross-p_common
# comparisons are uncontaminated (verified: every other latent is bit-identical
# on trials whose C did not flip). Prediction: implied weights shift with the
# prior per Bayes.
#
# Units: positions in degrees, variances in deg^2.

seed: 0

# --------------------------------------------------------------------------- #
# GENERATIVE MODEL
#   C ~ Bernoulli(p_common):  C=1 one shared source, C=2 two independent ones
#   vision is retinal (needs the eye signal), proprioception is body-framed
# --------------------------------------------------------------------------- #
generative:
  p_common: 0.3

  mu0: 0.0                     # spatial prior mean on hand position
  sigma0_sq: 100.0             # hand sd 10 deg

  eye_mu: 0.0
  eye_sigma_sq: 81.0           # eye sd 9 deg

  # Per-trial measurement noise, drawn uniform and independently of C.
  # Narrow ranges (see header). sd in brackets.
  sigma2_vis_range:  [1.0, 1.2]     # sd 1.0-1.1 deg
  sigma2_prop_range: [4.0, 4.5]     # sd 2.0-2.1 deg
  sigma2_eye_range:  [3.7, 4.2]     # sd 1.9-2.0 deg

# --------------------------------------------------------------------------- #
# ENCODING (scalar measurements -> population codes = the network input)
# --------------------------------------------------------------------------- #
encoding:
  n_vis: 76                    # gaussian receptive fields, retinal visual cue
  n_prop: 76                   # push-pull code, proprioceptive hand
  n_eye: 76                    # push-pull code, eye position
  visual_field: [-85.0, 85.0]  # 2*rf_width margin -> 0.0% containment rejection here
  rf_width: 6.0
  gain_K: 180.0                # activity gain = gain_K / variance (SS4-calibrated)
  slope_range: [-1.0, 1.0]
  intercept_range: [0.0, 10.0]
  poisson_noise: true

# --------------------------------------------------------------------------- #
# MODEL
# --------------------------------------------------------------------------- #
model:
  hidden: [64, 64]             # layer 0 = SIL, layer 1 = MSL
  activation: sigmoid          # sigmoid | relu | tanh
  head: causal                 # causal (4 outputs) | fused (2 outputs, control twin)

# --------------------------------------------------------------------------- #
# TRAINING
#   The test split is stratified by analytical-posterior decile (SS8.4) so the
#   binned model comparison has equal power in every bin.
# --------------------------------------------------------------------------- #
training:
  n_trials: 50000
  split: [0.7, 0.15, 0.15]
  optimizer: adam              # adam | rprop (rprop is full-batch only)
  lr: 0.001
  epochs: 300
  batch_size: 256
  patience: 20
  standardize_inputs: true
  balance_loss: true

# --------------------------------------------------------------------------- #
# ANALYSIS
# --------------------------------------------------------------------------- #
analysis:
  # Bin centres of the disparity curves (figures 03/04/05/12, manuscript Fig. 4A/C,
  # the conditioned-bias flag); trials go to the nearest centre. Since 2026-10-03:
  # 2-deg steps across the transition (|d| < 12 holds 80 % of the trials on this
  # domain, 99 % lie below 34 deg), ending at +-30 so no bin rests on a few dozen
  # trials. The analysis block is not a training parameter -- 03_analyze.py
  # --config applies a change to an existing run without retraining.
  disparity_grid: [-30, -20, -15, -12, -10, -8, -6, -4, -2, 0, 2, 4, 6, 8, 10, 12, 15, 20, 30]
  reliability_levels: [1.0, 1.1, 1.2]   # must lie inside sigma2_vis_range; with this
                                        # range figure 05's levels differ by little
  ridge_alpha: 1.0
  decoder_test_size: 0.25
