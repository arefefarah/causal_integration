
seed: 0

# --------------------------------------------------------------------------- #
# GENERATIVE MODEL
#   C ~ Bernoulli(p_common):  C=1 one shared source, C=2 two independent ones
#   vision is retinal (needs the eye signal), proprioception is body-framed
# --------------------------------------------------------------------------- #
generative:
  p_common: 0.5

  mu0: 0.0                     # spatial prior mean on hand position
  sigma0_sq: 100             # hand sd 20.6 deg

  eye_mu: 0.0
  eye_sigma_sq: 81          # eye sd 18.0 deg

  # Per-trial measurement noise, drawn uniform and independently of C.
  sigma2_vis_range:  [1,1.2]
  sigma2_prop_range: [4,4.5]
  sigma2_eye_range:  [3.7,4.2]

# --------------------------------------------------------------------------- #
# ENCODING (scalar measurements -> population codes = the network input)
# --------------------------------------------------------------------------- #
encoding:
  n_vis: 76                    # gaussian receptive fields, retinal visual cue
  n_prop: 76                   # push-pull code, proprioceptive hand
  n_eye: 76                    # push-pull code, eye position
  visual_field: [-85.0, 85.0]  # 2*rf_width margin -> 0.8% containment rejection
  rf_width: 6.0
  gain_K: 180.0                # activity gain = gain_K / variance (SS4-calibrated)
  slope_range: [-1.0, 1.0]
  intercept_range: [0.0, 10.0]
  poisson_noise: true

# --------------------------------------------------------------------------- #
# MODEL
# --------------------------------------------------------------------------- #
model:
  hidden: [64,64]             # layer 0 = SIL, layer 1 = MSL
  activation: sigmoid          # sigmoid | relu | tanh
  head: causal                 # causal (4 outputs) | fused (2 outputs, control twin)

# --------------------------------------------------------------------------- #
# TRAINING
#   The test split is stratified by analytical-posterior decile (SS8.4) so the
#   binned model comparison has equal power in every bin.
# --------------------------------------------------------------------------- #
training:
  n_trials: 50000
  split: [0.7, 0.15, 0.15]
  optimizer: adam              # adam | rprop (rprop is full-batch only)
  lr: 0.001
  epochs: 300
  batch_size: 256
  patience: 20
  standardize_inputs: true
  balance_loss: true

# --------------------------------------------------------------------------- #
# ANALYSIS
# --------------------------------------------------------------------------- #
analysis:
  disparity_grid: [-40, -30, -20, -15, -10, -5, -2, 0, 2, 5, 10, 15, 20, 30, 40]
  reliability_levels: [1.5, 3.5, 6.0]   # must lie inside sigma2_vis_range
  ridge_alpha: 1.0
  decoder_test_size: 0.25
