# Every parameter of the project. Copy this file, change a few lines, and pass
# it with --config to any script; the config that produced a run is always
# copied into that run's results folder.
#
# Units: positions in degrees, variances in deg^2.

seed: 0

# --------------------------------------------------------------------------- #
# GENERATIVE MODEL
#   C ~ Bernoulli(p_common):  C=1 one shared source, C=2 two independent ones
#   vision is retinal (needs the eye signal), proprioception is body-framed
# --------------------------------------------------------------------------- #
generative:
  p_common: 0.5
  mu0: 0.0                     # spatial prior mean
  sigma0_sq: 100.0             # spatial prior variance
  eye_mu: 0.0
  eye_sigma_sq: 25.0
  sigma2_vis_range: [9, 16.0]     # per-trial noise variances, drawn uniform
  sigma2_prop_range: [16, 25]
  sigma2_eye_range: [25, 36]

# --------------------------------------------------------------------------- #
# ENCODING (scalar measurements -> population codes = the network input)
# --------------------------------------------------------------------------- #
encoding:
  n_vis: 50                    # gaussian receptive fields, retinal visual cue
  n_prop: 50                   # number of neurons for encoding push-pull code, proprioceptive hand
  n_eye: 50                   # push-pull code, eye position
  visual_field: [-75.0, 75.0]
  rf_width: 8.0
  gain_K: 10.0                 # activity gain = gain_K / variance
  slope_range: [-1.0, 1.0]
  intercept_range: [0.0, 10.0]
  poisson_noise: true

# --------------------------------------------------------------------------- #
# MODEL
# --------------------------------------------------------------------------- #
model:
  hidden: [64, 64]             # layer 0 = SIL, layer 1 = MSL
  activation: sigmoid          # sigmoid | relu | tanh
  head: causal                 # causal (4 outputs) | fused (2 outputs, control twin)

# --------------------------------------------------------------------------- #
# TRAINING
#   standardize_inputs and balance_loss are both needed: the input groups differ
#   ~30x in magnitude and the outputs live on different scales, so without them
#   the shared trunk learns var_prop and starves mu_prop.
# --------------------------------------------------------------------------- #
training:
  n_trials: 50000
  split: [0.7, 0.15, 0.15]
  optimizer: adam              # adam | rprop (rprop is full-batch only)
  lr: 0.001
  epochs: 300
  batch_size: 256
  patience: 20
  standardize_inputs: true
  balance_loss: true

# --------------------------------------------------------------------------- #
# ANALYSIS
# --------------------------------------------------------------------------- #
analysis:
  disparity_grid: [-30, -20, -15, -10, -5, -2, 0, 2, 5, 10, 15, 20, 30]
  reliability_levels: [2.0, 6, 8.0, 10, 12, 16.0]
  min_separation: 1.0          # deg; below this the implied fusion weight is unstable
  ridge_alpha: 1.0
  decoder_test_size: 0.25
